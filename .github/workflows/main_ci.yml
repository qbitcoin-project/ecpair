name: CI

on:
  push:
    branches: [main]
    tags: ['ecpair-v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:tests
      - run: npm run gitdiff:ci
      - run: npm run pack:check

  # Publish only matching release tags after all checks pass.
  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/ecpair-v') && github.repository == 'qbitcoin-project/ecpair'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
      - name: Verify tag matches the package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "ecpair-v$PKG_VERSION" || { echo "tag $GITHUB_REF_NAME != ecpair-v$PKG_VERSION"; exit 1; }
      - run: npm ci
      - name: Publish @qbtc/ecpair
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
